[build-system]
requires = ["scikit-build-core>=0.12", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "py2sess"
dynamic = ["version"]
description = "Standalone Python implementation of the optimized 2S-ESS forward model."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
authors = [
  {name = "Tianhao Le"},
]
keywords = ["radiative transfer", "atmospheric science", "remote sensing", "two-stream", "pytorch"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "h5py",
  "numpy",
  "PyYAML",
  "scipy",
]

[project.optional-dependencies]
torch = [
  "torch",
]
native = [
  "torch",
]
speed = [
  "numba",
]
plot = [
  "matplotlib",
]
dev = [
  "build",
  "cibuildwheel",
  "matplotlib",
  "numba",
  "pre-commit",
  "ruff",
  "scikit-build-core",
  "torch",
  "twine",
]

[project.urls]
Homepage = "https://github.com/happysky19/py2sess"
Repository = "https://github.com/happysky19/py2sess"
Issues = "https://github.com/happysky19/py2sess/issues"

[tool.scikit-build]
minimum-version = "0.12"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
wheel.packages = ["src/py2sess"]
sdist.include = ["CMakeLists.txt", "native/**", "src/py2sess/data/benchmark/*.npz"]

[tool.setuptools_scm]
fallback_version = "1.0.0"

[tool.ruff]
target-version = "py310"
line-length = 100
cache-dir = "/tmp/py2sess_ruff_cache"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
