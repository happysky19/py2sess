name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build, for example main, a release branch, or v0.4.2"
        required: true
        default: "main"
      tag:
        description: "Tag to publish, for example v0.4.2"
        required: false
      version:
        description: "Optional version override for dry-run builds, for example 0.4.2"
        required: false
      build_os:
        description: "Wheel OS target"
        required: true
        default: "Both"
        type: choice
        options:
          - Both
          - MacOS
          - Ubuntu
      python_versions:
        description: "JSON list of Python versions to build, for example [\"3.11\"]"
        required: true
        default: '["3.10","3.11","3.12","3.13"]'
      run_a100:
        description: "Run optional native CUDA smoke test on a self-hosted A100 runner"
        required: true
        default: false
        type: boolean
      a100_runner_labels:
        description: "JSON labels for the self-hosted A100 runner"
        required: true
        default: '["self-hosted","linux","x64","a100"]'
      publish:
        description: "Publish checked distributions to PyPI"
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-pypi-${{ github.event.inputs.ref }}-${{ github.event.inputs.publish }}
  cancel-in-progress: false

env:
  BUILD_TYPE: Release
  MACOS_ARCH: arm64
  HOST_PYTHON: "3.11"
  CUDA_TORCH_INDEX_URL: "https://download.pytorch.org/whl/cu128"
  CUDA_TORCH_VERSION: "2.10.0+cu128"
  CPU_TORCH_INDEX_URL: "https://download.pytorch.org/whl/cpu"
  CPU_TORCH_VERSION: "2.10.0+cpu"

defaults:
  run:
    shell: bash

jobs:
  build-macos:
    name: Build macOS Native Wheels
    if: ${{ github.event.inputs.build_os == 'Both' || github.event.inputs.build_os == 'MacOS' }}
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ${{ fromJSON(github.event.inputs.python_versions) }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref }}

      - name: Setup Host Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.HOST_PYTHON }}
          cache: pip

      - name: Configure macOS build env
        run: |
          PV=${{ matrix.python-version }}
          PV=${PV//./}
          echo "PY_VERSION=$PV" >> "$GITHUB_ENV"
          echo "CIBW_BUILD=cp${PV}*" >> "$GITHUB_ENV"
          echo "ARCHFLAGS=-arch ${{ env.MACOS_ARCH }}" >> "$GITHUB_ENV"
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PY2SESS=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          fi

      - name: Build macOS wheel
        env:
          CIBW_PLATFORM: macos
          CIBW_ARCHS: ${{ env.MACOS_ARCH }}
          CIBW_BUILD_FRONTEND: "build; args: --no-isolation"
          CIBW_CONFIG_SETTINGS: "cmake.define.PY2SESS_BUILD_NATIVE=ON"
          CIBW_BEFORE_BUILD: |
            python -m pip install 'cmake<=3.30' ninja build scikit-build-core setuptools-scm torch
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: |
            export TORCH_LIB=$(python -c 'import torch; print(torch.__path__[0] + "/lib")')
            export DYLD_FALLBACK_LIBRARY_PATH="$TORCH_LIB:$DYLD_FALLBACK_LIBRARY_PATH"
            delocate-wheel -e torch -e libc10 -e libtorch -w {dest_dir} {wheel}
          CIBW_TEST_REQUIRES: "torch"
          CIBW_TEST_COMMAND: python -c "import py2sess; assert py2sess.native_extension_available(), py2sess.native_backend_info(); from py2sess.reference_cases import load_tir_benchmark_case; load_tir_benchmark_case()"
        run: |
          pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse

      - name: Upload macOS wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.python-version }}-${{ env.MACOS_ARCH }}
          path: wheelhouse/*.whl

  build-linux:
    name: Build Linux Native Wheels
    if: ${{ github.event.inputs.build_os == 'Both' || github.event.inputs.build_os == 'Ubuntu' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ${{ fromJSON(github.event.inputs.python_versions) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref }}

      - name: Setup Host Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.HOST_PYTHON }}
          cache: pip

      - name: Configure Linux build env
        run: |
          PV=${{ matrix.python-version }}
          PV=${PV//./}
          echo "PY_VERSION=$PV" >> "$GITHUB_ENV"
          echo "CIBW_BUILD=cp${PV}*" >> "$GITHUB_ENV"
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PY2SESS=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          fi

      - name: Free Linux runner disk space
        run: |
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          python -m pip cache purge || true
          df -h

      - name: Build Linux CUDA-capable wheel
        env:
          CIBW_PLATFORM: linux
          CIBW_ARCHS: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: docker.io/pytorch/manylinux2_28-builder:cuda12.8
          CIBW_SKIP: "*musllinux*"
          CIBW_BUILD_FRONTEND: "build; args: --no-isolation"
          CIBW_CONFIG_SETTINGS: "cmake.define.PY2SESS_BUILD_NATIVE=ON cmake.define.PY2SESS_NATIVE_CUDA=ON"
          CIBW_BEFORE_BUILD: |
            python -m pip install 'cmake<=3.30' ninja build scikit-build-core setuptools-scm
            python -m pip install --index-url '${{ env.CUDA_TORCH_INDEX_URL }}' 'torch==${{ env.CUDA_TORCH_VERSION }}'
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: |
            export TORCH_LIB=$(python -c 'import torch; print(torch.__path__[0] + "/lib")')
            export LD_LIBRARY_PATH="$TORCH_LIB:$LD_LIBRARY_PATH"
            auditwheel repair \
              --exclude libtorch.so \
              --exclude libtorch_cpu.so \
              --exclude libtorch_cuda.so \
              --exclude libtorch_python.so \
              --exclude libc10.so \
              --exclude libc10_cuda.so \
              --exclude libcudart.so.12 \
              --exclude libnvrtc.so.12 \
              -w {dest_dir} {wheel}
          CIBW_BEFORE_TEST: |
            python -m pip install --index-url '${{ env.CPU_TORCH_INDEX_URL }}' 'torch==${{ env.CPU_TORCH_VERSION }}'
          CIBW_TEST_COMMAND: python -c "import importlib, importlib.util, torch, py2sess; native = importlib.import_module('py2sess._native'); assert importlib.util.find_spec('py2sess._native_cuda') is not None; info = py2sess.native_backend_info(); print(info); assert info['available'], info; assert not info['cuda'], info; assert info['level_fluxes'], info; from py2sess.reference_cases import load_tir_benchmark_case, load_uv_benchmark_case; load_tir_benchmark_case(); load_uv_benchmark_case()"
        run: |
          pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse

      - name: Upload Linux wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.python-version }}-x86_64
          path: wheelhouse/*.whl

  test-a100-native:
    name: Test Native CUDA on A100
    if: ${{ github.event.inputs.run_a100 == 'true' }}
    runs-on: ${{ fromJSON(github.event.inputs.a100_runner_labels) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref }}

      - name: Setup Host Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.HOST_PYTHON }}
          cache: pip

      - name: Configure version override
        if: ${{ github.event.inputs.version != '' }}
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PY2SESS=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"

      - name: Build and test CUDA native wheel
        env:
          CIBW_PLATFORM: linux
          CIBW_ARCHS: x86_64
          CIBW_BUILD: cp311*
          CIBW_MANYLINUX_X86_64_IMAGE: docker.io/pytorch/manylinux2_28-builder:cuda12.8
          CIBW_BUILD_FRONTEND: "build; args: --no-isolation"
          CIBW_CONFIG_SETTINGS: "cmake.define.PY2SESS_BUILD_NATIVE=ON cmake.define.PY2SESS_NATIVE_CUDA=ON"
          CIBW_CONTAINER_ENGINE: "docker; create_args: --gpus all"
          CIBW_BEFORE_BUILD: |
            python -m pip install 'cmake<=3.30' ninja build scikit-build-core setuptools-scm
            python -m pip install --index-url '${{ env.CUDA_TORCH_INDEX_URL }}' 'torch==${{ env.CUDA_TORCH_VERSION }}'
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: |
            export TORCH_LIB=$(python -c 'import torch; print(torch.__path__[0] + "/lib")')
            export LD_LIBRARY_PATH="$TORCH_LIB:$LD_LIBRARY_PATH"
            auditwheel repair \
              --exclude libtorch.so \
              --exclude libtorch_cpu.so \
              --exclude libtorch_cuda.so \
              --exclude libtorch_python.so \
              --exclude libc10.so \
              --exclude libc10_cuda.so \
              --exclude libcudart.so.12 \
              --exclude libnvrtc.so.12 \
              -w {dest_dir} {wheel}
          CIBW_BEFORE_TEST: |
            python -m pip install --index-url '${{ env.CUDA_TORCH_INDEX_URL }}' 'torch==${{ env.CUDA_TORCH_VERSION }}'
          CIBW_TEST_COMMAND: python -c "import importlib, torch, py2sess; assert torch.cuda.is_available(); native = importlib.import_module('py2sess._native'); cuda_native = importlib.import_module('py2sess._native_cuda'); info = py2sess.native_backend_info(); print(info); assert info['available'] and info['cuda'], info"
        run: |
          pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse

      - name: Upload A100 CUDA smoke wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-a100-cuda-cp311-x86_64
          path: wheelhouse/*.whl

  build-sdist:
    name: Build Source Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.HOST_PYTHON }}
          cache: pip

      - name: Build sdist
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PY2SESS="${{ github.event.inputs.version }}"
          fi
          python -m pip install build
          python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  validate-distributions:
    name: Validate Distributions
    needs: [build-macos, build-linux, build-sdist]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Require successful builds
        run: |
          if [[ "${{ github.event.inputs.build_os }}" != "Ubuntu" ]]; then
            test "${{ needs.build-macos.result }}" = "success"
          fi
          if [[ "${{ github.event.inputs.build_os }}" != "MacOS" ]]; then
            test "${{ needs.build-linux.result }}" = "success"
          fi
          test "${{ needs.build-sdist.result }}" = "success"

      - name: Aggregate into dist
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec mv {} dist/ \;

      - name: Check distributions
        run: |
          python -m venv .twine-check
          . .twine-check/bin/activate
          python -m pip install --upgrade pip twine pkginfo packaging
          python -m twine check dist/*

      - name: Upload checked distributions
        uses: actions/upload-artifact@v4
        with:
          name: checked-distributions
          path: dist/*

  publish-pypi:
    name: Publish to PyPI
    needs: [validate-distributions]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.publish == 'true' && needs.validate-distributions.result == 'success' }}
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate publish inputs
        run: |
          test -n "${{ github.event.inputs.tag }}"
          test "${{ github.event.inputs.ref }}" = "${{ github.event.inputs.tag }}"
          test "${{ github.event.inputs.build_os }}" = "Both"
          test '${{ github.event.inputs.python_versions }}' = '["3.10","3.11","3.12","3.13"]'

      - name: Download checked distributions
        uses: actions/download-artifact@v4
        with:
          name: checked-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
